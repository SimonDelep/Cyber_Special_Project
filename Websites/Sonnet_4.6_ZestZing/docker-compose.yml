services:
  db:
    image: postgres:16-alpine
    container_name: zestzing-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zestzing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zestzing_secret}
      POSTGRES_DB: ${POSTGRES_DB:-zestzing}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zestzing} -d ${POSTGRES_DB:-zestzing}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
