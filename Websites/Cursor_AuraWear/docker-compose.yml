services:
  db:
    image: postgres:16-alpine
    container_name: aurawear-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurawear
      POSTGRES_PASSWORD: aurawear
      POSTGRES_DB: aurawear
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurawear -d aurawear"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
