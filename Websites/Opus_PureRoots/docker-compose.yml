services:
  db:
    image: postgres:16-alpine
    container_name: pureroots-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pureroots
      POSTGRES_PASSWORD: pureroots
      POSTGRES_DB: pureroots
    ports:
      - "5432:5432"
    volumes:
      - pureroots_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pureroots -d pureroots"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pureroots_pgdata:
