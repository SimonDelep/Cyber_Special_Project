services:
  db:
    image: postgres:16-alpine
    container_name: sproutsoil-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sproutsoil
      POSTGRES_PASSWORD: sproutsoil
      POSTGRES_DB: sproutsoil
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sproutsoil -d sproutsoil"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
