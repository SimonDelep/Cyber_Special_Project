services:
  postgres:
    image: postgres:16-alpine
    container_name: hydroflasked-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: hydroflasked
      POSTGRES_PASSWORD: hydroflasked
      POSTGRES_DB: hydroflasked
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydroflasked -d hydroflasked"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
