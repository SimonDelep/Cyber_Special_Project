services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: everthread
      POSTGRES_PASSWORD: everthread
      POSTGRES_DB: everthread
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everthread -d everthread"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
