services:
  postgres:
    image: postgres:16-alpine
    container_name: auraash-db
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: auraash
      POSTGRES_PASSWORD: auraash
      POSTGRES_DB: auraash
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auraash -d auraash"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
